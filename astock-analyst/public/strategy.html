<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>策略扫描 · A 股分析终端</title>
<link rel="stylesheet" href="/milo.css">
</head>
<body class="milo">

<div class="m-wrap">

  <div class="m-section-title" style="margin-top:8px">
    <span class="ic">📡</span>策略扫描与看板
    <span id="scanStatus" class="muted" style="font-weight:500;font-size:13px;margin-left:8px"></span>
  </div>
  <p class="muted" style="margin:-4px 0 14px">基于 Sequoia-X 的 7 大选股策略。点击命中标的可跳转个股深度分析。</p>

  <div id="dataNotice" style="display:none;margin:-4px 0 16px;padding:10px 14px;border-radius:12px;background:#fff7e8;border:1px solid #f5ddb0;color:#a45b00;font-size:12.5px;line-height:1.65"></div>

  <div id="dataStatus" style="margin:-4px 0 16px;padding:10px 14px;border-radius:12px;background:#f8fafd;border:1px solid var(--m-line);color:var(--m-tx2);font-size:12.5px;line-height:1.65;display:none"></div>

  <div class="bar-actions">
    <button class="btn-run" style="width:auto;padding:9px 18px" id="btnScanAll">全市场扫描</button>
    <button class="btn-run" style="width:auto;padding:9px 18px;background:var(--m-accent2)" id="btnBacktest">运行回测</button>
    <label style="font-size:12px;color:var(--m-tx2);display:flex;align-items:center;gap:6px;padding:0 4px">
      <input type="checkbox" id="chkRelaxed"> 放宽高窄旗形条件
    </label>
    <span style="font-size:12px;color:var(--m-tx3)">持有
      <input id="btHold" type="number" min="1" max="20" value="5" style="width:48px;padding:4px 6px;border:1px solid var(--m-line2);border-radius:8px;text-align:center"> 天 ·
      样本
      <input id="btSample" type="number" min="5" max="40" value="15" style="width:48px;padding:4px 6px;border:1px solid var(--m-line2);border-radius:8px;text-align:center"> 期
    </span>
    <span id="btStatus" class="muted" style="font-size:12px"></span>
  </div>

  <div id="schedStatus" style="margin:0 0 16px;padding:10px 14px;border-radius:12px;background:#f8fafd;border:1px solid var(--m-line);color:var(--m-tx2);font-size:12px;line-height:1.7;display:none"></div>

  <div id="qualityBar"></div>

  <div id="boards"></div>

  <div id="empty" class="loading">正在加载策略元信息…</div>
</div>

<script src="/nav.js"></script>
<script src="/quality.js"></script>
<script>
  MiloNav.mount('strategy');
  if (window.MiloQuality) MiloQuality.mount('qualityBar');

  /* 数据状态：真实全市场数据要说清覆盖范围；演示数据要警告 */
  fetch('/api/sequoia/api/health').then(function (r) { return r.json(); }).then(function (d) {
    if (!d) return;
    var warn = document.getElementById('dataNotice');
    var info = document.getElementById('dataStatus');
    if (d.data_mode === 'demo') {
      if (warn) {
        warn.style.display = 'block';
        warn.innerHTML = '⚠️ 当前为 <b>演示数据</b>：股票代码是真实的，但 K 线为随机合成，' +
          '<b>显示的价格与真实行情不一致</b>，策略命中仅用于验证流程。';
      }
      return;
    }
    if (info) {
      info.style.display = 'block';
      info.innerHTML = '数据源：<b>' + (d.data_source === 'tencent' ? '腾讯行情（前复权）' : 'baostock（后复权）') +
        '</b> · 覆盖 <b>' + (d.symbols || 0).toLocaleString('zh-CN') + '</b> 只 A 股 · 最新交易日 <b>' +
        (d.latest_date || '—') + '</b>　（全市场扫描约 80 秒，请耐心等待）';
    }
  }).catch(function () {});

  /* 调度器状态：让用户知道数据什么时候自动更新；顺带显示 baostock 额度/封禁 */
  Promise.all([
    fetch('/api/sequoia/api/scheduler/status').then(function (r) { return r.json(); }).catch(function () { return null; }),
    fetch('/api/sequoia/api/bs/quota').then(function (r) { return r.json(); }).catch(function () { return null; })
  ]).then(function (res) {
    var d = res[0], q = res[1];
    var el = document.getElementById('schedStatus');
    if (!el || !d || !d.ok) return;
    el.style.display = 'block';
    var on = d.enabled ? '开启' : '关闭';
    var parts = ['自动任务：<b>' + on + '</b>（交易日 ' + esc(d.sync_time) + ' 增量更新 · ' +
      esc(d.scan_time) + ' 自动扫描）'];
    if (d.last_sync_at) {
      parts.push('上次增量：' + esc(d.last_sync_at.replace('T', ' ').slice(0, 16)) +
        (d.last_sync_ok ? ' <span style="color:var(--m-down)">成功</span>' : ' <span style="color:var(--m-up)">失败</span>'));
    }
    if (d.last_scan_at) {
      parts.push('上次扫描：' + esc(d.last_scan_at.replace('T', ' ').slice(0, 16)) +
        '（命中 ' + (d.last_scan_total == null ? '—' : d.last_scan_total) + ' 只）');
    }
    if (d.busy && (d.busy.sync || d.busy.scan)) {
      parts.push('<span style="color:var(--m-accent2)">正在执行' + (d.busy.sync ? '增量更新' : '扫描') + '…</span>');
    }
    if (q && q.ok) {
      if (q.blacklist_until) {
        parts.push('<span style="color:var(--m-up)">baostock 冻结至 ' +
          esc(String(q.blacklist_until).replace('T', ' ').slice(0, 16)) + '</span>' +
          '（本年累计 ' + q.blacklist_count_year + ' 次；数据源为腾讯，不受影响）');
      } else {
        parts.push('baostock 额度 ' + (q.used || 0) + '/' + (q.safe_limit || 42000) + ' 次');
      }
    }
    el.innerHTML = parts.join('　·　');
  }).catch(function () {});

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pctText(v) { if (v == null || isNaN(v)) return '--'; return (v >= 0 ? '+' : '') + Number(v).toFixed(2) + '%'; }
  function cls(v) { return v == null || isNaN(v) ? '' : (v >= 0 ? 'up' : 'down'); }
  function goto(code) {
    code = String(code || '').trim();
    if (!/^\d{6}$/.test(code)) { toast('请输入 6 位数字代码'); return; }
    location.href = 'analysis.html?code=' + code;
  }
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.classList.add('show'); });
    setTimeout(function () { t.classList.remove('show'); setTimeout(function () { t.remove(); }, 250); }, 1800);
  }

  var FALLBACK = [
    { key: 'ma_volume', name: '均线放量突破', group: '趋势与突破', desc: '均线多头 + 放量突破' },
    { key: 'turtle', name: '海龟突破', group: '趋势与突破', desc: '20日新高 + 成交额过亿 + 阳线防诱多' },
    { key: 'high_tight_flag', name: '高窄旗形', group: '趋势与突破', desc: '高而窄的旗形整理突破' },
    { key: 'limit_up_shakeout', name: '涨停洗盘', group: '趋势与突破', desc: '涨停洗盘回踩确认' },
    { key: 'uptrend_limit_down', name: '上升跌停反包', group: '超跌与反转', desc: '上升趋势中的跌停反包' },
    { key: 'rps_breakout', name: '欧奈尔RPS突破', group: '趋势与突破', desc: 'RPS相对强度突破' },
    { key: 'private_placement', name: '定增套利', group: '超跌与反转', desc: '定向增发事件驱动' }
  ];
  var STRATS = [];

  function renderBoards() {
    var groups = [], map = {};
    STRATS.forEach(function (s) {
      if (!map[s.group]) { map[s.group] = []; groups.push(s.group); }
      map[s.group].push(s);
    });
    var html = '';
    var badges = { '趋势与突破': '📈', '超跌与反转': '🔄' };
    groups.forEach(function (g) {
      html += '<div class="group-head"><span class="ric">' + (badges[g] || '🧩') + '</span>' + esc(g) + '</div>';
      html += '<div class="strat-grid">';
      map[g].forEach(function (s) {
        html +=
          '<div class="strat-card" id="card-' + s.key + '">' +
            '<div class="top">' +
              '<div><h4>' + esc(s.name) + '</h4><div class="desc">' + esc(s.desc) + '</div></div>' +
              '<span class="led" id="led-' + s.key + '"></span>' +
            '</div>' +
            '<div class="stats">' +
              '<div class="stat"><div class="k">命中</div><div class="v" id="cnt-' + s.key + '">—</div></div>' +
              '<div class="stat"><div class="k">胜率</div><div class="v" id="wr-' + s.key + '">—</div></div>' +
              '<div class="stat"><div class="k">均收益</div><div class="v" id="ar-' + s.key + '">—</div></div>' +
              '<div class="stat"><div class="k">样本</div><div class="v" id="sm-' + s.key + '">—</div></div>' +
            '</div>' +
            '<div class="picks" id="picks-' + s.key + '"><span class="muted" style="font-size:12px">未扫描</span></div>' +
            '<button class="btn-run" data-key="' + s.key + '" style="margin-top:10px">仅扫描该策略</button>' +
          '</div>';
      });
      html += '</div>';
    });
    document.getElementById('boards').innerHTML = html;
    document.getElementById('empty').style.display = 'none';
    document.querySelectorAll('.btn-run[data-key]').forEach(function (b) {
      b.onclick = function () { scanOne(b.dataset.key); };
    });
  }

  function renderPicks(key, picks, strat) {
    var el = document.getElementById('picks-' + key);
    var led = document.getElementById('led-' + key);
    if (!picks || !picks.length) {
      var why = '本次无命中';
      if (strat && strat.error) {
        why = '执行异常：' + strat.error;
      } else if (key === 'high_tight_flag') {
        why = '本次无命中（该策略四条件同时成立才入选，A 股常态下一天 0 只属正常；可勾选上方「放宽条件」看相近形态）';
      } else if (key === 'private_placement') {
        why = '本次无命中（需要 akshare 拉取定增事件数据，离线环境不可用）';
      }
      el.innerHTML = '<span class="muted" style="font-size:12px">' + esc(why) + '</span>';
      if (led) led.className = 'led';
      return;
    }
    if (led) led.className = 'led on';
    var badge = (strat && strat.relaxed_params)
      ? '<span class="muted" style="font-size:11px;margin-right:6px">已放宽</span>' : '';
    el.innerHTML = badge + picks.slice(0, 40).map(function (p) {
      var c = p.pct == null ? '' : cls(p.pct);
      var pc = p.pct == null ? '' : pctText(p.pct);
      return '<span class="p" data-code="' + esc(p.symbol) + '" title="' + esc(p.symbol + (p.name ? ' ' + p.name : '')) + '"><b>' + esc(p.symbol) + '</b>' +
        (p.name ? ' ' + esc(p.name) : '') + ' ' +
        (p.last == null ? '' : '<span class="' + c + '">' + pc + '</span>') + '</span>';
    }).join('');
    el.querySelectorAll('.p').forEach(function (x) { x.onclick = function () { goto(x.dataset.code); }; });
  }

  function applyScan(res) {
    var total = 0;
    (res.strategies || []).forEach(function (s) {
      var cnt = document.getElementById('cnt-' + s.key);
      if (cnt) cnt.textContent = s.count == null ? '—' : s.count;
      total += (s.count || 0);
      renderPicks(s.key, s.picks || [], s);
    });
    document.getElementById('scanStatus').textContent =
      '扫描于 ' + (res.time || '—') + ' · 共命中 ' + total + ' 只' + (res.error ? '（部分策略异常）' : '');
  }

  function relaxParam() {
    var el = document.getElementById('chkRelaxed');
    return el && el.checked ? '&relaxed=1' : '';
  }

  function scanAll() {
    document.getElementById('scanStatus').textContent = '扫描中… 全市场约需 80 秒';
    fetch('/api/sequoia/api/scan?name=all' + relaxParam(), { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(applyScan)
      .catch(function (e) { document.getElementById('scanStatus').textContent = '扫描失败：' + e.message; });
  }

  function scanOne(key) {
    fetch('/api/sequoia/api/scan?name=' + encodeURIComponent(key) + relaxParam(), { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        (res.strategies || []).forEach(function (s) {
          var cnt = document.getElementById('cnt-' + s.key);
          if (cnt) cnt.textContent = s.count == null ? '—' : s.count;
          renderPicks(s.key, s.picks || [], s);
        });
      })
      .catch(function (e) { toast('扫描失败：' + e.message); });
  }

  function applyBacktest(res) {
    (res.strategies || []).forEach(function (s) {
      var wr = document.getElementById('wr-' + s.key);
      var ar = document.getElementById('ar-' + s.key);
      var sm = document.getElementById('sm-' + s.key);
      if (wr) wr.innerHTML = s.win_rate == null ? '—' : s.win_rate + '<small>%</small>';
      if (ar) { ar.innerHTML = s.avg_return == null ? '—' : s.avg_return + '<small>%</small>'; ar.className = 'v ' + cls(s.avg_return); }
      if (sm) sm.textContent = s.samples == null ? '—' : s.samples;
    });
    document.getElementById('btStatus').textContent = '回测完成 · ' + (res.time || '') + ' · 持有 ' + (res.hold || '?') + ' 天';
  }

  var lastBtTime = null, btTimer = null;
  function runBacktest() {
    var hold = parseInt(document.getElementById('btHold').value, 10) || 5;
    var sample = parseInt(document.getElementById('btSample').value, 10) || 15;
    document.getElementById('btStatus').textContent = '回测进行中…';
    fetch('/api/sequoia/api/backtest?hold=' + hold + '&sample=' + sample, { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function () {
        var tries = 0;
        if (btTimer) clearInterval(btTimer);
        btTimer = setInterval(function () {
          tries++;
          fetch('/api/sequoia/api/backtest/results')
            .then(function (r) { return r.json(); })
            .then(function (res) {
              if (res && res.strategies && res.strategies.length &&
                  res.strategies[0].samples != null && res.time && res.time !== lastBtTime) {
                lastBtTime = res.time;
                applyBacktest(res);
                clearInterval(btTimer); btTimer = null;
              } else if (tries > 25) {
                document.getElementById('btStatus').textContent = '回测超时，请稍后在策略引擎侧查看';
                clearInterval(btTimer); btTimer = null;
              }
            })
            .catch(function () {});
        }, 1500);
      })
      .catch(function (e) { document.getElementById('btStatus').textContent = '回测启动失败：' + e.message; });
  }

  document.getElementById('btnScanAll').onclick = scanAll;
  document.getElementById('btnBacktest').onclick = runBacktest;

  // 初始化：拉元信息（失败用兜底）
  fetch('/api/sequoia/api/strategies')
    .then(function (r) { return r.json(); })
    .then(function (list) {
      if (Array.isArray(list) && list.length) STRATS = list; else STRATS = FALLBACK;
      renderBoards();
      // 自动跑一次全扫描，首屏就有数据
      scanAll();
    })
    .catch(function () { STRATS = FALLBACK; renderBoards(); scanAll(); });
</script>
</body>
</html>

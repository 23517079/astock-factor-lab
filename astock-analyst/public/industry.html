<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行业强度 · A 股分析终端</title>
<link rel="stylesheet" href="/milo.css">
</head>
<body class="milo">

<div class="m-wrap">

  <div class="m-section-title" style="margin-top:8px">
    <span class="ic">🏭</span>行业强度榜
    <span id="indStatus" class="muted" style="font-weight:500;font-size:13px;margin-left:8px"></span>
  </div>
  <p class="muted" style="margin:-4px 0 14px">新浪行业板块，按强度排序。强度 = 50 + 板块涨跌幅 × 6（截断 0~100）。点击板块查看领涨股。</p>

  <div class="ind-filters" id="filters">
    <span class="f active" data-f="all">全部</span>
    <span class="f" data-f="strong">强势 (&gt;60)</span>
    <span class="f" data-f="weak">弱势 (&lt;40)</span>
  </div>

  <div class="ind-layout">
    <div class="m-card ind-list" id="list"><div class="loading">加载中…</div></div>
    <div class="m-card ind-detail" id="detail" style="padding:18px">
      <div class="muted">从左侧选择一个板块查看详情</div>
    </div>
  </div>
</div>

<script src="/nav.js"></script>
<script>
  MiloNav.mount('industry');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function cls(v) { return v == null || isNaN(v) ? '' : (v >= 0 ? 'up' : 'down'); }
  function pctText(v) { if (v == null || isNaN(v)) return '--'; return (v >= 0 ? '+' : '') + Number(v).toFixed(2) + '%'; }
  function bigNum(v) { if (v == null || isNaN(v)) return '—'; if (v >= 1e8) return (v / 1e8).toFixed(2) + ' 亿'; if (v >= 1e4) return (v / 1e4).toFixed(2) + ' 万'; return Number(v).toFixed(0); }

  var ALL = [], FILTER = 'all', SELECTED = null;

  function filtered() {
    if (FILTER === 'strong') return ALL.filter(function (b) { return b.strength > 60; });
    if (FILTER === 'weak') return ALL.filter(function (b) { return b.strength < 40; });
    return ALL;
  }

  function renderList() {
    var list = document.getElementById('list');
    var rows = filtered();
    if (!rows.length) { list.innerHTML = '<div class="muted" style="padding:14px">该筛选下暂无板块</div>'; return; }
    list.innerHTML = rows.map(function (b) {
      return '<div class="ind-item' + (b.id === SELECTED ? ' active' : '') + '" data-id="' + esc(b.id) + '">' +
        '<span class="nm">' + esc(b.name) + '</span>' +
        '<span class="pc ' + cls(b.changePct) + '">' + pctText(b.changePct) + '</span>' +
        '<span class="st">强度 ' + (b.strength == null ? '--' : b.strength.toFixed(0)) + '</span>' +
      '</div>';
    }).join('');
    list.querySelectorAll('.ind-item').forEach(function (el) {
      el.onclick = function () { SELECTED = el.dataset.id; renderList(); renderDetail(); };
    });
  }

  function renderDetail() {
    var box = document.getElementById('detail');
    var b = ALL.find(function (x) { return x.id === SELECTED; });
    if (!b) { box.innerHTML = '<div class="muted">从左侧选择一个板块查看详情</div>'; return; }
    var strength = b.strength == null ? 0 : b.strength;
    box.innerHTML =
      '<div class="head">' + esc(b.name) +
        '<span class="' + cls(b.changePct) + '">' + pctText(b.changePct) + '</span></div>' +
      '<div class="summary">' + (b.count || '—') + ' 家成分 · 平均涨跌 ' +
        '<span class="' + cls(b.avgChange) + '">' + pctText(b.avgChange) + '</span> · 成交 ' + bigNum(b.amount) + '</div>' +
      '<div style="margin:8px 0 18px">' +
        '<div style="height:10px;background:var(--m-line);border-radius:999px;overflow:hidden">' +
          '<div style="height:100%;width:' + Math.max(0, Math.min(100, strength)) + '%;background:linear-gradient(90deg,var(--m-accent),#6aa1ff)"></div>' +
        '</div>' +
        '<div class="muted" style="font-size:12px;margin-top:6px">强度 ' + strength.toFixed(1) + ' / 100</div>' +
      '</div>' +
      (b.leadCode ?
        '<div style="font-size:13px;font-weight:700;margin-bottom:8px">领涨股</div>' +
        '<div class="lead-card main">' +
          '<div class="role">领涨</div>' +
          '<div class="ln">' + esc(b.leadName || b.leadCode) +
            ' <span class="muted" style="font-weight:600;font-size:12px">' + esc(b.leadCode) + '</span>' +
            (b.leadPrice != null ? '<span class="lp ' + cls(b.leadChangePct) + '">' + Number(b.leadPrice).toFixed(2) + ' · ' + pctText(b.leadChangePct) + '</span>' : '') +
          '</div>' +
          '<div style="margin-top:8px"><button class="btn-run" style="width:auto;padding:7px 14px" data-code="' + esc(b.leadCode) + '">进入个股分析 →</button></div>' +
        '</div>'
        : '<div class="muted">该板块暂无领涨股数据</div>');
    var btn = box.querySelector('button[data-code]');
    if (btn) btn.onclick = function () { location.href = 'analysis.html?code=' + btn.dataset.code; };
  }

  function load() {
    document.getElementById('indStatus').textContent = '加载中…';
    fetch('/api/industry')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok || !d.boards || !d.boards.length) {
          document.getElementById('list').innerHTML = '<div class="muted" style="padding:14px">行业数据暂不可用</div>';
          document.getElementById('indStatus').textContent = '失败：' + esc((d.errors || []).join('；') || '无数据');
          return;
        }
        ALL = d.boards;
        document.getElementById('indStatus').textContent = '共 ' + ALL.length + ' 个板块 · 更新于 ' + esc(d.asOf || '');
        // 深链 #boardId
        var hash = (location.hash || '').replace('#', '');
        if (hash && ALL.some(function (x) { return x.id === hash; })) SELECTED = hash;
        else SELECTED = ALL.length ? ALL[0].id : null;
        renderList(); renderDetail();
      })
      .catch(function (e) {
        document.getElementById('list').innerHTML = '<div class="muted" style="padding:14px">异常：' + esc(e.message) + '</div>';
      });
  }

  document.getElementById('filters').querySelectorAll('.f').forEach(function (f) {
    f.onclick = function () {
      document.querySelectorAll('#filters .f').forEach(function (x) { x.classList.remove('active'); });
      f.classList.add('active');
      FILTER = f.dataset.f;
      renderList();
    };
  });

  load();
</script>
</body>
</html>

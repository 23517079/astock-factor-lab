<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美股联动 · A 股分析终端</title>
<link rel="stylesheet" href="/milo.css">
<style>
  body { margin: 0; background: var(--m-bg); }
  .us-wrap { max-width: 1240px; margin: 0 auto; padding: 22px 22px 60px; }
  .us-head h1 { font-size: 22px; margin: 0 0 6px; color: var(--m-tx); }
  .us-head p { margin: 0 0 16px; font-size: 13px; color: var(--m-tx2); }

  .verdict { background: #fff; border-radius: 18px; padding: 20px 22px; box-shadow: var(--m-shadow); margin-bottom: 16px; border-left: 5px solid var(--m-accent); }
  .verdict.lian { border-left-color: var(--m-down); }
  .verdict.bei  { border-left-color: var(--m-accent2); }
  .verdict.none { border-left-color: #b9c3d6; }
  .verdict .tag-row { display: flex; gap: 10px; align-items: center; margin-bottom: 9px; flex-wrap: wrap; }
  .verdict .tag { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: #eaf1ff; color: var(--m-accent); }
  .verdict .tag.conf { background: #f4f6fb; color: var(--m-tx2); font-weight: 600; }
  .verdict h2 { font-size: 18px; margin: 0 0 8px; color: var(--m-tx); }
  .verdict .detail { font-size: 12.5px; color: var(--m-tx2); line-height: 1.7; margin-bottom: 10px; }
  .verdict .hint { font-size: 13px; color: var(--m-tx); background: #f8fafd; border-radius: 11px; padding: 11px 13px; line-height: 1.65; }

  .pairs { display: grid; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .pair { background: #fff; border-radius: 15px; padding: 15px 16px; box-shadow: var(--m-shadow); }
  .pair .t { font-size: 12px; color: var(--m-tx3); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .pair .rel { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; background: #f4f6fb; color: var(--m-tx2); font-weight: 600; }
  .pair .rel.lian { background: #eafaf1; color: #0f7a45; }
  .pair .rel.bei { background: #fff2e8; color: #b45309; }
  .pair .row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 5px 0; }
  .pair .row span:first-child { color: var(--m-tx2); }

  .ud-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 16px; align-items: start; }
  .ud-card { background: #fff; border-radius: 16px; box-shadow: var(--m-shadow); overflow: hidden; }
  .ud-card .hd { padding: 13px 16px; border-bottom: 1px solid var(--m-line); font-size: 13px; font-weight: 700; color: var(--m-tx); display: flex; justify-content: space-between; }
  .ud-card .hd small { font-weight: 500; color: var(--m-tx3); font-size: 11px; }
  .ud-list { padding: 6px 8px 10px; }
  .ud-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 8px; border-radius: 9px; font-size: 13px; }
  .ud-item:hover { background: #fafcff; }
  .ud-item .nm { color: var(--m-tx); }
  .ud-item .nm small { color: var(--m-tx3); font-size: 11px; margin-left: 5px; font-family: var(--mono); }
  .ud-item .nm .prev { display: block; margin: 2px 0 0; font-family: inherit; font-size: 10.5px; }
  .ud-item .v { text-align: right; }
  .ud-item .v b { font-weight: 700; }
  .ud-item .v small { display: block; font-size: 11.5px; }
  .up { color: var(--m-up); }
  .down { color: var(--m-down); }
  .flat { color: var(--m-tx2); }
  .dim { color: var(--m-tx3); }
  .us-actions { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .us-btn { border: none; border-radius: 10px; padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer; color: #fff; background: var(--m-accent); }
  .us-btn.gray { background: #8896ad; }
  .us-btn:hover { filter: brightness(1.06); }
  .us-note { font-size: 11.5px; color: var(--m-tx3); line-height: 1.7; margin-top: 14px; }
  .loading-box { padding: 40px; text-align: center; color: var(--m-tx3); font-size: 13px; }
</style>
</head>
<body>

<div class="us-wrap">
  <div class="us-head">
    <h1>美股联动</h1>
    <p>用美股隔夜表现判断 A 股次日方向：是外部传导（联动）还是本土主导（背离）。美股数据来自新浪全球行情，A 股为实时行情。</p>
  </div>

  <div class="us-actions">
    <button id="btnRefresh" class="us-btn">刷新</button>
    <label style="font-size:12.5px;color:var(--m-tx2);display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="autoRefresh"> 每 60 秒自动刷新
    </label>
    <span id="status" style="font-size:12px;color:var(--m-tx3)"></span>
  </div>

  <div id="qualityBar"></div>
  <div id="verdictBox"></div>
  <div id="pairsBox" class="pairs"></div>
  <div id="gridBox" class="ud-grid"></div>

  <div class="us-note">
    说明：联动判定用「美股上一交易日收盘」对「A 股当日表现」，属于隔夜传导关系，不是因果预测。科技股对比用美股科技龙头（英伟达/AMD/台积电/博通/苹果等）等权均值 vs A 股科技类 ETF 均值；中概对比用中概 ADR 均值 vs 中概互联 ETF。<br>
    本页只做方向参考，不构成投资建议；数据源异常时会明确标注「—」，不会用 0 填充。
  </div>
</div>

<script src="/nav.js"></script>
<script src="/quality.js"></script>
<script>
  if (window.MiloNav) MiloNav.mount('us');
  if (window.MiloQuality) MiloQuality.mount('qualityBar');

  var timer = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pct(v) {
    if (v == null) return '<span class="dim">—</span>';
    var c = v > 0 ? 'up' : (v < 0 ? 'down' : 'flat');
    return '<span class="' + c + '">' + (v > 0 ? '+' : '') + Number(v).toFixed(2) + '%</span>';
  }
  function cls(v) { return v == null ? 'flat' : (v > 0 ? 'up' : (v < 0 ? 'down' : 'flat')); }

  function renderVerdict(v) {
    var box = document.getElementById('verdictBox');
    if (!v) { box.innerHTML = ''; return; }
    var tone = v.type === '联动' ? 'lian' : (v.type === '背离' ? 'bei' : 'none');
    box.innerHTML = '<div class="verdict ' + tone + '">' +
      '<div class="tag-row"><span class="tag">' + esc(v.type) + '</span>' +
      '<span class="tag conf">置信度 ' + esc(v.confidence) + '</span></div>' +
      '<h2>' + esc(v.headline) + '</h2>' +
      '<div class="detail">' + esc(v.detail) + '</div>' +
      '<div class="hint">次日观察：' + esc(v.nextDayHint) + '</div>' +
      (v.dataCaveat ? '<div class="hint" style="color:#b42318">数据提示：' +
        esc(v.dataCaveat) + '</div>' : '') +
      '</div>';
  }

  function renderPairs(pairs) {
    var box = document.getElementById('pairsBox');
    if (!pairs || !pairs.length) { box.innerHTML = ''; return; }
    box.innerHTML = pairs.map(function (p) {
      var rel = p.relation || '数据不足';
      var rc = /^联动/.test(rel) ? 'lian' : (rel === '背离' ? 'bei' : '');
      return '<div class="pair">' +
        '<div class="t"><span>' + esc(p.name) + '</span><span class="rel ' + rc + '">' + esc(rel) + '</span></div>' +
        '<div class="row"><span>' + esc(p.usName) + '</span><span>' + pct(p.usPct) + '</span></div>' +
        '<div class="row"><span>' + esc(p.aName) + '</span><span>' + pct(p.aPct) + '</span></div>' +
        '<div class="row" style="border-top:1px dashed var(--m-line);margin-top:6px;padding-top:7px">' +
        '<span>差值</span><span>' + (p.gap == null ? '<span class="dim">—</span>' : p.gap.toFixed(2) + ' 个百分点') + '</span></div>' +
        '</div>';
    }).join('');
  }

  function money(v) {
    if (v == null) return '<span class="dim">—</span>';
    return Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function listCard(title, sub, items, showCode) {
    var rows = (items || []).map(function (x) {
      var prev = (x.prevClose != null)
        ? '<small class="prev dim">昨收 ' + money(x.prevClose) + '</small>' : '';
      return '<div class="ud-item"><div class="nm">' + esc(x.name) +
        (showCode && x.code ? '<small>' + esc(x.code) + '</small>' : '') + prev + '</div>' +
        '<div class="v"><b>' + money(x.price) + '</b><small class="' + cls(x.changePct) + '">' +
        (x.changePct == null ? '—' : (x.changePct > 0 ? '+' : '') + Number(x.changePct).toFixed(2) + '%') +
        '</small></div></div>';
    }).join('') || '<div class="ud-item"><span class="dim">无数据</span></div>';
    return '<div class="ud-card"><div class="hd"><span>' + esc(title) + '</span><small>' + esc(sub || '') + '</small></div>' +
      '<div class="ud-list">' + rows + '</div></div>';
  }

  /* 卡片右上角标真实行情时间，不写「隔夜收盘」这种一定会过期的文案 */
  function usTimeOf(list) {
    var hit = (list || []).filter(function (x) { return x.usTime; })[0];
    return hit ? hit.usTime + ' 收盘' : '';
  }

  function renderGrid(d) {
    var box = document.getElementById('gridBox');
    var html = '';
    html += listCard('美股指数', usTimeOf(d.us.indices), d.us.indices, false);
    html += listCard('美股科技龙头', usTimeOf(d.us.tech), d.us.tech, false);
    html += listCard('中概股 ADR', usTimeOf(d.us.adr), d.us.adr, false);
    html += listCard('A 股指数', d.a.asOf || '', d.a.indices, true);
    html += listCard('A 股科技 ETF', '实时', d.a.tech, true);
    html += listCard('中概代理（A股跨境ETF）', '实时', d.a.adr, true);
    box.innerHTML = html;
  }

  async function load() {
    var st = document.getElementById('status');
    st.textContent = '正在拉取美股与 A 股行情…';
    document.getElementById('verdictBox').innerHTML = '<div class="loading-box">加载中…</div>';
    try {
      var r = await fetch('/api/us-linkage', { cache: 'no-store' });
      var d = await r.json();
      if (!d.ok) {
        document.getElementById('verdictBox').innerHTML =
          '<div class="verdict none"><div class="tag-row"><span class="tag">数据不足</span></div>' +
          '<h2>暂时拿不到完整的联动数据</h2><div class="detail">' +
          esc((d.errors || []).join('；') || '数据源异常') + '</div></div>';
      } else {
        renderVerdict(d.verdict);
      }
      renderPairs(d.pairs);
      renderGrid(d);
      st.textContent = '更新时间 ' + new Date().toLocaleTimeString('zh-CN');
    } catch (e) {
      st.textContent = '加载失败：' + e.message;
      document.getElementById('verdictBox').innerHTML =
        '<div class="loading-box">加载失败：' + esc(e.message) + '</div>';
    }
  }

  document.getElementById('btnRefresh').onclick = load;
  document.getElementById('autoRefresh').onchange = function () {
    if (timer) { clearInterval(timer); timer = null; }
    if (this.checked) timer = setInterval(load, 60000);
  };

  load();
</script>
</body>
</html>
